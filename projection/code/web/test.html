<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Server Test</title>
<style>
  :root { --bg:#111; --fg:#eee; --mute:#888; --line:#2a2a2a; --ok:#4caf7a; --err:#e05a5a; --acc:#e09a3a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:16px; font-weight:600; margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; }
  #conn { font-size:12px; color:var(--mute); }
  #conn.on { color:var(--ok); }
  .state { border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:12px; }
  .flow { display:flex; gap:4px; flex-wrap:wrap; }
  .flow span { flex:1; min-width:60px; text-align:center; padding:8px 4px; border-radius:6px; background:#1c1c1c; color:var(--mute); font-size:12px; font-weight:600; }
  .flow span.cur { background:var(--acc); color:#111; }
  #video { margin-top:8px; color:var(--mute); font-size:12px; }
  .btns { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px; }
  button { padding:14px 8px; border:1px solid var(--line); border-radius:8px; background:#1c1c1c; color:var(--fg); font:inherit; font-weight:600; cursor:pointer; }
  button:active { background:#2a2a2a; }
  button.cancel { border-color:var(--err); color:var(--err); }
  #log { border:1px solid var(--line); border-radius:8px; padding:8px; height:260px; overflow:auto; font:12px/1.5 ui-monospace, monospace; }
  #log div.out { color:var(--mute); }
  #log div.err { color:var(--err); }
  #log div.evt { color:var(--acc); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Media Server <span id="conn">connecting…</span></h1>
  <div class="state">
    <div class="flow" id="flow">
      <span data-s="IDLE">IDLE</span><span data-s="T_IN">T_IN</span><span data-s="T_MID">T_MID</span><span data-s="T_OUT">T_OUT</span><span data-s="ACTIVE">ACTIVE</span>
    </div>
    <div id="video">video: –</div>
  </div>
  <div class="btns">
    <button data-cmd='{"cmd":"play","video":"a"}'>Play A</button>
    <button data-cmd='{"cmd":"play","video":"b"}'>Play B</button>
    <button data-cmd='{"cmd":"release"}'>Release</button>
    <button data-cmd='{"cmd":"state"}'>State</button>
    <button data-cmd='nope'>Bad JSON</button>
    <button class="cancel" data-cmd='{"cmd":"cancel"}'>Cancel</button>
  </div>
  <div id="log"></div>
</div>
<script>
  const logEl = document.getElementById('log');
  const connEl = document.getElementById('conn');
  let ws;

  function log(text, cls) {
    const d = document.createElement('div');
    d.className = cls || '';
    d.textContent = new Date().toLocaleTimeString() + '  ' + text;
    logEl.prepend(d);
  }

  function show(state, video) {
    document.querySelectorAll('#flow span').forEach(s => s.classList.toggle('cur', s.dataset.s === state));
    document.getElementById('video').textContent = 'video: ' + (video || '–');
  }

  function connect() {
    ws = new WebSocket('ws://' + location.host + '/');
    ws.onopen = () => { connEl.textContent = 'connected'; connEl.className = 'on'; };
    ws.onclose = () => { connEl.textContent = 'reconnecting…'; connEl.className = ''; setTimeout(connect, 1000); };
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch { log('<- ' + e.data, 'err'); return; }
      if (m.state) show(m.state, m.video);
      log('<- ' + e.data, m.event ? 'evt' : (m.ok === false ? 'err' : ''));
    };
  }

  document.querySelectorAll('button[data-cmd]').forEach(b => b.onclick = () => {
    if (!ws || ws.readyState !== 1) return log('not connected', 'err');
    ws.send(b.dataset.cmd);
    log('-> ' + b.dataset.cmd, 'out');
  });

  connect();
</script>
</body>
</html>
